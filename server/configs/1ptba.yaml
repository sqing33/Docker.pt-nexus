site_name: "1ptba"

# 1ptba (1ptba.com) 发种映射配置
# 抓取来源: https://1ptba.com/upload.php (2026-09-09)
# 表单: action=takeupload.php method=post enctype=multipart/form-data
# 文件字段: file
# 关键差异: select 字段名带 [4] 后缀(同 aling/mypt/lemon); 有 source_sel[4] 与 audiocodec_sel[4];
#          有 url(IMDb 链接)但无 pt_gen; 分类 12 类(含 Software/Games/eBook/AV 另列);
#          tags[4][] 约 25 项; 页面存在两个 name=type 的 select(普通类 401-412 + AV 类 610-625),引擎只发普通类
# 匿名: NexusPHP 标准 uplver (由 anonymous.go 默认兜底, 无需配置)

upload_file_field: "file"

form_fields:
  category: "type"
  medium: "medium_sel[4]"
  video_codec: "codec_sel[4]"
  audio_codec: "audiocodec_sel[4]"
  resolution: "standard_sel[4]"
  source: "source_sel[4]"
  team: "team_sel[4]"
  name: "name"
  small_descr: "small_descr"
  description: "descr"
  imdb_url: "url"                 # IMDb 链接文本框(无独立 dburl/pt_gen)
  technical_info: "technical_info"
  "tags[4][]": "tags[4][]"

source_parsers:
  source_params:
    type:
      source_key: "类型"
    medium:
      source_key: "媒介"
    video_codec:
      source_key: "编码"
    audio_codec:
      source_key: "音频"
    resolution:
      source_key: "分辨率"
    source:
      source_key: "来源"
    team:
      source_key: "制作组"

  standard_keys:
    type:
      "Movies": "category.movie"
      "Movies-3D": "category.movie"
      "电影": "category.movie"
      "TV-Episode": "category.tv_series"
      "TV-Pack": "category.tv_series"
      "TV-Show": "category.tv_series"
      "电视剧": "category.tv_series"
      "Documentary": "category.documentaries"
      "纪录片": "category.documentaries"
      "Animation": "category.animation"
      "动画": "category.animation"
      "Concert": "category.movie"
      "Music-Video": "category.movie"
      "Music": "category.movie"
      "Sports": "category.movie"
      "E-Books": "category.movie"
      "Games": "category.movie"
      "Others": "category.movie"

    medium:
      "UHD Blu-ray": "medium.uhd_bluray"
      "UHD原盘": "medium.uhd_bluray"
      "UHD DIY": "medium.uhd_diy"
      "FHD Blu-ray": "medium.bluray"
      "BD原盘": "medium.bluray"
      "Blu-ray": "medium.bluray"
      "BD DIY": "medium.bluray_diy"
      "Blu-ray DIY": "medium.bluray_diy"
      "MiniBD": "medium.minibd"
      "Remux": "medium.remux"
      "Encode": "medium.encode"
      "WEB-DL": "medium.webdl"
      "HDTV": "medium.hdtv"
      "TV": "medium.hdtv"
      "DVD": "medium.dvd"
      "DVDR": "medium.dvd"
      "CD": "medium.cd"
      "Track": "medium.track"
      "Other": "medium.other"

    video_codec:
      "H.264": "video.h264"
      "H.265": "video.h265"
      "HEVC": "video.h265"
      "AV1": "video.av1"
      "MPEG-2": "video.mpeg2"
      "VC-1": "video.vc1"
      "Xvid": "video.other"
      "Other": "video.other"

    audio_codec:
      "FLAC": "audio.flac"
      "APE": "audio.ape"
      "DTS": "audio.dts"
      "DTS-HD": "audio.dts_hd"
      "TrueHD": "audio.truehd"
      "AC3": "audio.ac3"
      "DD+": "audio.ddp"
      "AAC": "audio.aac"
      "MP3": "audio.mp3"
      "OGG": "audio.ogg"
      "Other": "audio.other"

    resolution:
      "8K": "resolution.r4320p"
      "4K": "resolution.r2160p"
      "2160p": "resolution.r2160p"
      "1080p": "resolution.r1080p"
      "1080i": "resolution.r1080p"
      "720p": "resolution.r720p"
      "SD": "resolution.sd"

    source:
      "Blu-ray": "source.bluray"
      "BD原盘": "source.bluray"
      "UHD Blu-ray": "source.uhd_bluray"
      "WEB-DL": "source.webdl"
      "HDTV": "source.hdtv"
      "REMUX": "source.remux"
      "DVD": "source.dvd"
      "Encode": "source.encode"
      "CD": "source.cd"
      "Track": "source.track"
      "Other": "source.other"

    team:
      "HDS": "team.hds"
      "CHD": "team.chd"
      "MySiLu": "team.mysilu"
      "WiKi": "team.wiki"
      "Other": "team.other"
      "1PTBA": "team.1ptba"

mappings:
  # type 分类(普通类, 401-412): 401=电影 402=剧集 403=综艺 404=纪录教育 405=动漫
  #   406=音视频 407=体育 408=高质音频 409=其他 410=软件 411=游戏 412=电子书
  type:
    "category.movie": "401"
    "category.movie_3d": "401"
    "category.tv_series": "402"
    "category.tv_pack": "402"
    "category.tv_shows": "403"
    "category.documentaries": "404"
    "category.animation": "405"
    "category.mv": "406"
    "category.music": "406"
    "category.sports": "407"
    "category.stage": "409"
    "category.other": "409"
    "default": "401"

  # medium_sel[4] 媒介: 1=Blu-ray 2=HD DVD 3=Remux 4=MiniBD 5=HDTV 6=DVDR 7=Encode 8=CD 9=Track 16=UHD 17=UHD DIY 19=BD DIY
  medium:
    "medium.bluray": "1"
    "medium.uhd_bluray": "16"
    "medium.uhd_diy": "17"
    "medium.bluray_diy": "19"
    "medium.remux": "3"
    "medium.hdtv": "5"
    "medium.dvd": "6"
    "medium.encode": "7"
    "medium.cd": "8"
    "medium.track": "9"
    "medium.minibd": "4"
    "medium.hd_dvd": "2"
    "medium.webdl": "7"
    "medium.other": "7"
    "default": "7"

  # codec_sel[4] 视频编码(仅视频部分, 音频在 audiocodec_sel): 1=H.264 2=VC-1 3=Xvid 4=MPEG-2 5=Other 18=H.265
  video_codec:
    "video.h264": "1"
    "video.x264": "1"
    "video.vc1": "2"
    "video.xvid": "3"
    "video.mpeg2": "4"
    "video.mpeg4": "4"
    "video.h265": "18"
    "video.x265": "18"
    "video.hevc": "18"
    "video.av1": "5"
    "video.other": "5"
    "default": "5"

  # audiocodec_sel[4] 音频编码: 1=FLAC 2=APE 3=DTS 4=MP3 5=OGG 6=AAC 7=Other 31=TrueHD
  audio_codec:
    "audio.flac": "1"
    "audio.ape": "2"
    "audio.dts": "3"
    "audio.dts_hd": "3"
    "audio.mp3": "4"
    "audio.ogg": "5"
    "audio.aac": "6"
    "audio.ac3": "6"
    "audio.truehd": "31"
    "audio.ddp": "31"
    "audio.other": "7"
    "default": "7"

  # standard_sel[4] 分辨率: 1=1080p 2=1080i 3=720p 4=SD 16=4K 17=8K
  resolution:
    "resolution.r1080p": "1"
    "resolution.r1080i": "2"
    "resolution.r720p": "3"
    "resolution.sd": "4"
    "resolution.r2160p": "16"
    "resolution.r4320p": "17"
    "resolution.other": "4"
    "default": "4"

  # source_sel[4] 来源类型: 1=BD 2=DVD 4=HDTV 16=UHD 17=UHD DIY 19=BD DIY 20=REMUX 22=encode 23=WEB-DL 25=CD 26=Track
  source:
    "source.bluray": "1"
    "source.uhd_bluray": "16"
    "source.webdl": "23"
    "source.remux": "20"
    "source.hdtv": "4"
    "source.dvd": "2"
    "source.encode": "22"
    "source.cd": "25"
    "source.track": "26"
    "source.other": "4"
    "default": "4"

  # team_sel[4] 制作组: 1=HDS 2=CHD 3=MySiLu 4=WiKi 5=Other 20=1PTBA
  team:
    "team.hds": "1"
    "team.chd": "2"
    "team.mysilu": "3"
    "team.wiki": "4"
    "team.other": "5"
    "team.1ptba": "20"
    "default": "5"

  # tags[4][] 标签: 1=禁转 2=首发 4=DIY 5=国配 6=中字 7=HDR10 17=限转 18=原创 19=粤配 20=官字组
  #   21=Dolby Vision 22=HDR10+ 23=应求 24=特效 25=音乐专辑 26=Music Video 27=卡拉OK 28=LIVE现场 29=演唱会 30=最佳影片 31=AI修复
  tag:
    "tag.禁转": "1"
    "tag.限转": "17"
    "tag.原创": "18"
    "tag.首发": "2"
    "tag.国配": "5"
    "tag.粤配": "19"
    "tag.中字": "6"
    "tag.官字组": "20"
    "tag.DIY": "4"
    "tag.杜比视界": "21"
    "tag.Dolby Vision": "21"
    "tag.HDR": "7"
    "tag.HDR10": "7"
    "tag.HDR10+": "22"
    "tag.应求": "23"
    "tag.特效": "24"
    "tag.音乐专辑": "25"
    "tag.Music Video": "26"
    "tag.卡拉OK": "27"
    "tag.LIVE现场": "28"
    "tag.演唱会": "29"
    "tag.AI修复": "31"
    "tag.最佳影片": "30"
    "default": null
