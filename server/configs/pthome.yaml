site_name: "PTHOME"

# PTHOME (铂金家, www.pthome.net) 发种映射配置
# 抓取来源: https://www.pthome.net/upload.php (2026-09-09)
# 表单: action=takeupload.php method=post enctype=multipart/form-data
# 文件字段: file
# 关键差异:
#   - select 字段名【不带】[4] 后缀 (同 lemonhd, 不同于 aling/mypt/lemon/1ptba)
#   - 标签字段是裸名 tags[] (不是 tags[4][])，值为短代码(yc/gy/yy/zz/db/hdr10 等)
#   - 有 douban_id 文本框(直接填豆瓣数字 ID) 与 url(IMDb 链接)；无 pt_gen、无 dburl
#   - 无 source_sel；无 uplver 匿名字段(PTHOME 不支持匿名发种)
# 匿名: 无 (PTHOME 表单无 uplver 字段, 引擎默认兜底的 uplver 提交会被服务端忽略, 不影响发种)

upload_file_field: "file"

form_fields:
  category: "type"
  medium: "medium_sel"
  video_codec: "codec_sel"
  audio_codec: "audiocodec_sel"
  resolution: "standard_sel"
  team: "team_sel"
  name: "name"
  small_descr: "small_descr"
  description: "descr"
  imdb_url: "url"                 # IMDb 链接文本框(无独立 dburl/pt_gen)
  # 注意: 标签字段名键必须是 "tags[]" (basic_fields.go resolveTagFieldBase 专门查此键)
  "tags[]": "tags[]"
  # 注: douban_id 期望纯数字豆瓣 ID, 引擎无自动链接→数字提取(仅 TTG 有专属 adapter),
  #     故不配置, 发种时该字段留空, 用户可手动在 webui 补; 配了会把完整 URL 填入导致异常

source_parsers:
  source_params:
    type:
      source_key: "类型"
    medium:
      source_key: "媒介"
    video_codec:
      source_key: "编码"
    audio_codec:
      source_key: "音频编码"
    resolution:
      source_key: "分辨率"
    team:
      source_key: "制作组"

  standard_keys:
    type:
      "Movies": "category.movie"
      "电影": "category.movie"
      "TV-Episode": "category.tv_series"
      "TV-Pack": "category.tv_series"
      "TV-Show": "category.tv_series"
      "电视剧": "category.tv_series"
