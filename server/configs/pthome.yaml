  # medium_sel 媒介: 1=Blu-ray 2=DVD原盘 3=REMUX 5=HDTV 8=CD 9=Track 10=WEB-DL 11=Other 12=UHD Blu-ray 13=UHD Blu-ray/DIY 14=Blu-ray/DIY 15=encode
