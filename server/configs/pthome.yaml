  #   (另有两个 type select: 507=有声书 508=电子书, 引擎仅发普通类, 图书类罕见用 default 兜底)
  type:
    "category.movie": "401"
    "category.tv_series": "402"
    "category.tv_pack": "402"
    "category.tv_shows": "403"
    "category.documentaries": "404"
    "category.animation": "405"
    "category.anime": "405"
    "category.mv": "408"
    "category.music": "408"
    "category.sports": "407"
    "category.stage": "409"
    "category.game": "410"
    "category.software": "411"
    "category.study": "412"
    "category.other": "409"
